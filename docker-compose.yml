services:
  vmhq-mcp:
    image: ${VMHQ_MCP_IMAGE:-ghcr.io/vmhq/vmhq-mcp:latest}
    build:
      context: .
    env_file:
      - path: .env
        required: false
    ports:
      # Loopback only: the reverse proxy reaches the container over the Docker
      # network, and MCP_TRUST_PROXY defaults to trusting forwarded IP headers,
      # which a direct connection could forge. Set HOST_BIND=0.0.0.0 only when
      # nothing sits in front of this server.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3010}:${MCP_PORT:-3010}"
    volumes:
      - vmhq-mcp-data:/app/data
      # Mount the SSH key used by the Proxmox shell tools (PROXMOX_SSH_KEY_PATH).
      # - ./secrets/proxmox_id_ed25519:/app/data/ssh/id_ed25519:ro
    restart: unless-stopped

volumes:
  vmhq-mcp-data:
